name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "pilot/results/**", "scripts/publish_go.py", "adpbench/site.py", "tests/test_site*", "tests/test_publish_go.py", ".github/workflows/deploy-site.yml"]
  pull_request:
    paths: ["site/**", "pilot/results/**", "scripts/publish_go.py", "adpbench/site.py", "tests/test_site*", "tests/test_publish_go.py", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate site evidence and JavaScript
        run: |
          node --input-type=module --check < site/assets/app.js
          node --test tests/test_site_evidence.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen-result publication
        run: |
          python -m pip install 'numpy>=1.24'
          python -m unittest discover -s tests -p test_publish_go.py -v
          python -m unittest discover -s tests -p test_site.py -v
      # Downloadable site bundle (deploy to any static host).
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
      # Pages artifact, used by the deploy job when Pages is enabled.
      - uses: actions/configure-pages@v5
        if: ${{ github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true' }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true' }}
        with:
          path: site

  deploy:
    needs: build
    # GitHub Pages is free for public repositories; for a private repository it
    # needs a paid plan. Once Pages is enabled in repo settings, set the
    # ENABLE_PAGES=true repository variable to switch this on.
    if: ${{ github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
