name: OpenCode Go agent schedule
run-name: "OpenCode Go · ${{ github.event_name == 'pull_request' && 'schedule checks' || 'hourly wave check' }}"

# Dispatches the next wave of a scheduled agent round, and the publisher for its
# finished waves (see scripts/go_schedule.py). It never calls a model. The
# dispatched run claims each slot before any request, exactly as a manual
# dispatch does.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/go-agent-schedule.yml"
      - "scripts/go_schedule.py"
      - "tests/test_go_schedule.py"

permissions:
  contents: read

concurrency:
  group: go-agent-schedule
  cancel-in-progress: false

jobs:
  checks:
    name: Scheduler decisions (no model calls, no dispatch)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'numpy>=1.24,<3'
      - run: python -m unittest tests.test_go_schedule -v

  dispatch:
    name: Dispatch the next wave and publication if due
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # Only to dispatch go-agent.yml and publish-results.yml.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'numpy>=1.24,<3'
      - name: Check the scheduled plan and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.go_schedule check --dispatch | tee -a "$GITHUB_STEP_SUMMARY"
