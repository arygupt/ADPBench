name: Go pilot (cost-efficient screen)
run-name: "Go cost screen · ${{ inputs.run_models && 'model evaluation' || 'offline checks' }}"

on:
  workflow_dispatch:
    inputs:
      run_models:
        description: "Spend Go quota on the reviewed six-request screen"
        type: boolean
        default: false
      subscription_only:
        description: "I confirm Go Use balance is OFF (no Zen balance fallback)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/go-cost-pilot.yml"
      - "scripts/go_pilot.py"
      - "pilot/go-cost-screen-20260921.json"
      - "tests/test_go_pilot.py"

permissions:
  contents: read

concurrency:
  group: go-cost-screen-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAN: pilot/go-cost-screen-20260921.json

jobs:
  checks:
    name: Request limits (no model calls)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'numpy>=1.24'
      - name: Require subscription-only confirmation before spending
        env:
          RUN_MODELS: ${{ inputs.run_models }}
          SUBSCRIPTION_ONLY: ${{ inputs.subscription_only }}
        run: |
          if test "$RUN_MODELS" = true && test "$SUBSCRIPTION_ONLY" != true; then
            echo 'Turn off Go Use balance and confirm subscription-only usage first.' >&2
            exit 1
          fi
      - run: python -m unittest discover -s tests -p test_go_pilot.py -v

  pilot:
    name: Prepare once, generate and score the screen
    needs: checks
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_models && inputs.subscription_only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # At-most-once tag claim; not available inside scoring.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'numpy>=1.24'
      - name: Validate finite authorization window before preparation
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.go_pilot import read_plan, due, now_utc
          plan = read_plan(Path(os.environ['PLAN']))
          assert all(due(plan, model, now_utc()) for model in plan['models']), 'Batch authorization expired'
          PY
      - uses: docker/setup-buildx-action@v3
      - name: Restore or build the pinned scoring toolchain once
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/Dockerfile
          load: true
          tags: adpbench-go:ci
          cache-from: type=gha,scope=adpbench-replay-toolchain
          cache-to: type=gha,mode=max,scope=adpbench-replay-toolchain
      - name: Validate the two baseline fixtures before any model calls
        run: |
          mkdir -p runs/go-cost-fixture
          docker run --rm --network none --memory 5g --cpus 2 --pids-limit 256 \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            -e PYTHONPATH=/repo -e ADPBENCH_WORKDIR=/tmp/adpbench \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$GITHUB_WORKSPACE/runs/go-cost-fixture:/output" \
            -w /repo adpbench-go:ci \
            python -m scripts.go_pilot fixture --plan "$PLAN" --model mimo-v2.5 --out /output
      - name: Claim the six-request batch once, including failed attempts
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENCODE_GO_API_KEY" || { echo 'Missing Go secret'; exit 1; }
          ref='tags/go-cost-screen-20260921'
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/$ref" >/dev/null 2>&1; then
            echo 'Batch already claimed; no additional model calls.' >> "$GITHUB_STEP_SUMMARY"
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Creation must succeed; an API error never authorizes generation.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/$ref" -f sha="$GITHUB_SHA" >/dev/null
          echo 'claimed=true' >> "$GITHUB_OUTPUT"
      - name: Run the reviewed models sequentially, without retries or fallback
        if: steps.claim.outputs.claimed == 'true'
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          set -euo pipefail
          echo '## Go cost screen: model evaluation, not preparation-only' >> "$GITHUB_STEP_SUMMARY"
          echo 'At most six requests; 8,192 output tokens each. Two operators per model. No retries.' >> "$GITHUB_STEP_SUMMARY"
          for model in $(jq -r '.models[].id' "$PLAN"); do
            output="$GITHUB_WORKSPACE/runs/go-cost/$model"
            generation_status=0
            python -m scripts.go_pilot generate --plan "$PLAN" --model "$model" --out "$output" || generation_status=$?
            # No credentials, network access, or writable repo in the scorer.
            docker run --rm --network none --memory 5g --cpus 2 --pids-limit 256 \
              --user "$(id -u):$(id -g)" \
              --cap-drop ALL --security-opt no-new-privileges \
              -e PYTHONPATH=/repo -e ADPBENCH_WORKDIR=/tmp/adpbench \
              -v "$GITHUB_WORKSPACE:/repo:ro" -v "$output:/output" \
              -w /repo adpbench-go:ci \
              python -m scripts.go_pilot score --plan "$PLAN" --model "$model" --out /output
            echo "### $model" >> "$GITHUB_STEP_SUMMARY"
            cat "$output/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
            if test "$generation_status" -ne 0; then
              echo 'Stopped the entire screen after generation failure; no retries or remaining model calls.' >> "$GITHUB_STEP_SUMMARY"
              exit "$generation_status"
            fi
          done
      - name: Preserve prompts, request settings, usage, frozen RTL and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-cost-screen-${{ github.run_id }}
          path: |
            runs/go-cost/
            runs/go-cost-fixture/
          if-no-files-found: warn
          retention-days: 90
